# Сборка iOS-приложения Nocturne (.ipa) на бесплатном Mac от GitHub.
# Сборка неподписанная: подпись делает Sideloadly на вашем компьютере вашим Apple ID.
# Последняя сборка всегда по ссылке:
#   https://github.com/madecursed/freeplay/releases/latest/download/Nocturne.ipa
name: iOS (.ipa)

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-build
  cancel-in-progress: true

jobs:
  ipa:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Веб-сборка
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Сборка приложения (без подписи)
        run: |
          xcodebuild -version
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковка .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Nocturne.ipa Payload
          ls -lh Nocturne.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: Nocturne-ipa
          path: Nocturne.ipa

      - name: Публикация в Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-${{ github.run_number }}
          name: Nocturne для iPhone — сборка ${{ github.run_number }}
          make_latest: true
          files: Nocturne.ipa
          body: |
            Неподписанная сборка. Установка: Sideloadly на компьютере → перетащить Nocturne.ipa → ваш Apple ID → Start.
            Подробно — раздел «Приложение для iPhone» в README.
